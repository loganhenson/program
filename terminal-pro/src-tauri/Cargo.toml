[package]
name = "terminal-pro"
version = "0.5.0"
description = "TerminalPro"
authors = ["you"]
license = ""
repository = ""
default-run = "terminal-pro"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "3.0.0-alpha.6", features = [] }
# Tauri 3 no longer bundles a webview: wry is the system webview (WKWebView)
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
terminal = { path = "../../terminal-server" }
preflight = { path = "../../preflight" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
