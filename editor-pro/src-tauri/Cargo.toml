[package]
name = "editor-pro"
version = "0.5.2"
description = "EditorPro"
authors = ["Logan Henson"]
license = ""
repository = ""
default-run = "editor-pro"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "3.0.0-alpha.6", features = [] }
# Tauri 3 no longer bundles a webview: wry is the system webview (WKWebView)
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-store = "3.0.0-alpha.3"
notify = "8"
# "Delete" in the file tree moves things to the Trash
trash = "5"
terminal = { path = "../../terminal-server" }
filetree = { path = "./src/filetree" }
preflight = { path = "../../preflight" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# the mock runtime, for tests of how handlers behave
tauri = { version = "3.0.0-alpha.6", features = ["test"] }
